spring:
  application:
    name: church-retreat-ops
  profiles:
    default: local
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  flyway:
    baselineOnMigrate: true
    validateOnMigrate: false
    outOfOrder: true

server:
  port: 8080

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml

app:
  identity:
    app-name: ${APP_IDENTITY_APP_NAME:청년2부 수련회}
    organization-name: ${APP_IDENTITY_ORGANIZATION_NAME:지구촌교회 드림공동체 청년2부}
    event-name: ${APP_IDENTITY_EVENT_NAME:청년2부 수련회}
  jwt:
    secret: ${APP_JWT_SECRET:local-dev-secret-change-me-local-dev-secret-change-me}
    access-token-expiration-minutes: 120
  bootstrap:
    system-admin:
      email: ${APP_SYSTEM_ADMIN_EMAIL:admin@example.local}
      password: ${APP_SYSTEM_ADMIN_PASSWORD:admin1234!}
      name: ${APP_SYSTEM_ADMIN_NAME:System Admin}
  registration:
    self-edit-enabled: ${APP_REGISTRATION_SELF_EDIT_ENABLED:true}
  check-in:
    qr-expires-at: ${APP_CHECK_IN_QR_EXPIRES_AT:2026-08-18T23:59:59+09:00}
